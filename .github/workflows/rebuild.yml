name: rebuild-on-upstream

# Watches upstream libpng (pnggroup/libpng) and zstd (facebook/zstd) releases.
# When either has a newer stable release than the version pinned in
# VERSIONS.json, it advances the vendor/libpng and vendor/zstd git submodules
# to the new tag, rebuilds pxltool, runs the round-trip test, and (on success)
# commits the bump. On test failure it opens an issue instead of committing.

on:
  schedule:
    - cron: "17 5 * * *"   # daily at 05:17 UTC (off the top of the hour)
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: write
  issues: write

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zlib1g-dev jq

      - name: Resolve latest upstream stable releases
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # zstd publishes GitHub Releases, so take the latest non-prerelease.
          latest_release() {
            local repo="$1"
            gh api "repos/$repo/releases" --jq \
              '[.[] | select(.prerelease==false and .draft==false)][0].tag_name'
          }

          # libpng publishes none at all -- the releases endpoint returns an
          # empty list -- so its stable versions have to come from tags. The tag
          # namespace holds more than releases: prereleases (v1.7.0beta89, which
          # sorts above v1.6.58), the historical libpng-1.6.31-signed set, and
          # unrelated projects (pngzop-1.0.2). Anchoring on exactly vX.Y.Z admits
          # only stable releases and rejects all three. Sorted by version, not by
          # tag order, since tag order is not guaranteed. Without this the libpng
          # half of this job silently resolved to an empty string and never fired.
          latest_stable_tag() {
            local repo="$1"
            gh api --paginate "repos/$repo/tags?per_page=100" --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1
          }

          png_tag="$(latest_stable_tag pnggroup/libpng || true)"
          zstd_tag="$(latest_release facebook/zstd || true)"

          # Normalize to bare versions, e.g. v1.6.60 -> 1.6.60, zstd-1.5.8 -> 1.5.8.
          norm() { echo "$1" | sed -E 's/^(v|zstd-|libpng-)//'; }
          png_ver="$(norm "$png_tag")"
          zstd_ver="$(norm "$zstd_tag")"

          echo "png_tag=$png_tag"   >> "$GITHUB_OUTPUT"
          echo "zstd_tag=$zstd_tag" >> "$GITHUB_OUTPUT"
          echo "png_ver=$png_ver"   >> "$GITHUB_OUTPUT"
          echo "zstd_ver=$zstd_ver" >> "$GITHUB_OUTPUT"

          cur_png="$(jq -r .libpng VERSIONS.json)"
          cur_zstd="$(jq -r .zstd  VERSIONS.json)"
          echo "cur_png=$cur_png"   >> "$GITHUB_OUTPUT"
          echo "cur_zstd=$cur_zstd" >> "$GITHUB_OUTPUT"

          changed=false
          [ -n "$png_ver" ]  && [ "$png_ver"  != "$cur_png"  ] && changed=true
          [ -n "$zstd_ver" ] && [ "$zstd_ver" != "$cur_zstd" ] && changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "libpng: $cur_png -> $png_ver   zstd: $cur_zstd -> $zstd_ver   changed=$changed"

      - name: Advance vendored submodules
        if: steps.latest.outputs.changed == 'true'
        run: |
          set -euo pipefail
          png_ver="${{ steps.latest.outputs.png_ver }}"
          zstd_ver="${{ steps.latest.outputs.zstd_ver }}"

          if [ -n "$png_ver" ] && [ "$png_ver" != "${{ steps.latest.outputs.cur_png }}" ]; then
            git -C vendor/libpng fetch --tags origin
            git -C vendor/libpng checkout "${{ steps.latest.outputs.png_tag }}"
          fi

          if [ -n "$zstd_ver" ] && [ "$zstd_ver" != "${{ steps.latest.outputs.cur_zstd }}" ]; then
            git -C vendor/zstd fetch --tags origin
            git -C vendor/zstd checkout "${{ steps.latest.outputs.zstd_tag }}"
          fi

      - name: Build (vendored) and test
        if: steps.latest.outputs.changed == 'true'
        id: build
        run: |
          set -euo pipefail
          cmake -B build -DPXL_VENDORED=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Update VERSIONS.json and commit
        if: steps.latest.outputs.changed == 'true' && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          jq --arg png "${{ steps.latest.outputs.png_ver }}" \
             --arg zstd "${{ steps.latest.outputs.zstd_ver }}" \
             '.libpng=$png | .zstd=$zstd' VERSIONS.json > VERSIONS.tmp
          mv VERSIONS.tmp VERSIONS.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Name what is committed rather than `git add -A`. VERSIONS.json and
          # the two submodule gitlinks are the whole change; a blanket add
          # would sweep up anything else the build happened to leave behind,
          # which is how build artifacts got committed here once before.
          git add VERSIONS.json vendor/libpng vendor/zstd
          git commit -m "chore: bump libpng ${{ steps.latest.outputs.png_ver }} / zstd ${{ steps.latest.outputs.zstd_ver }}, rebuild pxl"
          git push

      - name: Open issue on build failure
        if: failure() && steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Automated rebuild failed for libpng ${{ steps.latest.outputs.png_ver }} / zstd ${{ steps.latest.outputs.zstd_ver }}" \
            --body "The scheduled upstream rebuild failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
